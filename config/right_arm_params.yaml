/**:
  ros__parameters:
    # Serial port configuration
    port: "/dev/justinaRightArm"
    baudrate: 1000000
    
    # Control parameters
    torque_enable: true
    max_speed: 40
    
    # Arm servo configuration
    servo_arm_ids: [0, 4, 1, 2]
    servo_arm_bits_per_radian: [651.7394, 651.7394, 651.7394, 651.7394]
    servo_arm_zeros: [2187, 2437, 2408, 2365]
    servo_arm_directions: [1, 1, 1, 1]
    
    # Gripper servo configuration
    servo_gripper_ids: [7, 8]
    servo_gripper_bits_per_radian: [651.7394, 651.7394]
    servo_gripper_zeros: [1513, 2956]
    servo_gripper_directions: [1, 1]
    
    # Joint names
    joint_names: ["torso_shoulder", "shoulder_arm_motor", "elbow", "wrist", "right_jaw_joint", "left_jaw_joint"]